name: Android CI & APK Build

on:
  push:
    branches: [ "main", "master", "jules-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print CI Environment Diagnostics
        run: |
          echo "CI Commit SHA: ${{ github.sha }}"
          echo "CI Ref: ${{ github.ref }}"
          git rev-parse HEAD

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Print Gradle Version
        run: ./gradlew --version

      - name: Inspect Projects and Available Tasks
        run: |
          ./gradlew projects
          ./gradlew :app:tasks --all
          ./gradlew :core:tasks --all
          ./gradlew :infrastructure:tasks --all

      - name: Run Core & Infrastructure Tests
        run: ./gradlew :core:test :infrastructure:test --stacktrace

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Debug APK Existence
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Debug APK found successfully at app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "ERROR: Debug APK file not found!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-builder-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
